# AI Gateway Deployment
# 套用：kubectl apply -f 05-gateway-deployment.yaml -n ai-gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels:
    app: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
      - name: ai-gateway
        image: ai-gateway:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gateway-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: DB_PASSWORD
        - name: MYDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: MYDB_PASSWORD
        volumeMounts:
        - name: api-keys
          mountPath: /run/secrets
          readOnly: true
        - name: solr-data
          mountPath: /usr/local/tomcat/solrhome
        - name: rag-docs
          mountPath: /usr/local/tomcat/rag-docs
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: api-keys
        secret:
          secretName: gateway-secrets
          items:
          - key: gemini-key
            path: gemini-key
          - key: openrouter-key
            path: openrouter-key
          - key: xai-key
            path: xai-key
      - name: solr-data
        persistentVolumeClaim:
          claimName: solr-pvc
      - name: rag-docs
        emptyDir: {}
