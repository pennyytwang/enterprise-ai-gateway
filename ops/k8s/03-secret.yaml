# 本機 K8s 示範用機密
# stringData 讓 k8s 自動 base64；這些值只供本機練習，請勿用於正式環境。
# 密碼需與 mysql-init/01-init.sql 相同。
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  labels:
    app: ai-gateway
type: Opaque
stringData:
  DB_PASSWORD: "aigateway_demo_app"
  MYDB_PASSWORD: "aigateway_demo_ro"
  MYSQL_ROOT_PASSWORD: "aigateway_demo_root"
  # 雲端 API Key（留空即可啟動；要測試 LLM 時填入）
  gemini-key: ""
  openrouter-key: ""
  xai-key: ""
